<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b0e">
<title>Undead Afterdark - Movement Fix</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050709;color:#eee;font-family:system-ui;display:grid;place-items:center;text-align:center}
a{color:#ff696f} .muted{opacity:.7;font-size:13px}
</style>
</head>
<body>
<div id="load"><h1>UNDEAD AFTERDARK</h1><p>Loading movement-control update…</p><p class="muted">Analog stick dead zone + proportional speed</p></div>
<script>
(async()=>{
  const src='https://cdn.jsdelivr.net/gh/ret906-boop/-undead-afterdark@056c6b8fb22318b67cea8fe780e33e9306772701/index.html';
  try{
    const r=await fetch(src,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let h=await r.text();

    // Preserve analog magnitude. The old update loop normalized every input to full speed.
    h=h.replace(
      'l=Math.hypot(mx,my)||1;mx/=l;my/=l;',
      'l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}'
    );

    // Replace the original binary-feeling touch stick with a true analog stick.
    const start=h.indexOf('function stick(el,knob,onMove)');
    const next=h.indexOf("stick($('movePad')",start);
    if(start<0||next<0) throw new Error('Movement stick code not found');
    const improved="function stick(el,knob,onMove){let id=null,cx=0,cy=0;el.addEventListener('pointerdown',e=>{id=e.pointerId;el.setPointerCapture(id);const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;move(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e)});const end=e=>{if(e.pointerId!==id)return;id=null;knob.style.transform='translate(0,0)';onMove(0,0,false)};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);function move(e){let rx=e.clientX-cx,ry=e.clientY-cy,l=Math.hypot(rx,ry),ux=0,uy=0,m=Math.min(34,l),strength=0;if(l){ux=rx/l;uy=ry/l;strength=l<=5?0:Math.min(1,(l-5)/29)}knob.style.transform='translate('+(ux*m)+'px,'+(uy*m)+'px)';onMove(ux*strength,uy*strength,true,e)}}";
    h=h.slice(0,start)+improved+h.slice(next);

    document.open();
    document.write(h);
    document.close();
  }catch(err){
    document.getElementById('load').innerHTML='<h1>UNDEAD AFTERDARK</h1><p>Movement patch failed to load.</p><p><a href="'+src+'">Open the fallback build</a></p><p class="muted">'+String(err)+'</p>';
  }
})();
</script>
</body>
</html>
