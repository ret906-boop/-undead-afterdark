name: Deploy Undead Afterdark V30

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v30
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build verified V30 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          curl --fail --location --retry 5 \
            "https://ret906-boop.github.io/-undead-afterdark/?v30base=${GITHUB_SHA}" \
            -o /tmp/base.html

          base_hash=$(sha256sum /tmp/base.html | awk '{print $1}')
          v29='ecdabdc562b8701172880ab44dea080e9ae3cf8e03ba185af2421cbb94589756'
          v30='c5f589ac3eabb3f266a712108df05bb73503d066d74935aace7feb613118dd50'

          if [ "$base_hash" = "$v30" ]; then
            cp /tmp/base.html site/index.html
          elif [ "$base_hash" = "$v29" ]; then
            tr -d '[:space:]' < tools/v30_patch/v30.patch.gz.b64 | base64 --decode | gzip -dc > /tmp/v30.patch
            echo '7e163b0dd3be6284b1c4b54802b09a4a6d6165d9b1b5c034822b63044eacf813  /tmp/v30.patch' | sha256sum -c -
            cp /tmp/base.html site/index.html
            cd site
            patch -p1 < /tmp/v30.patch
            cd ..
          else
            echo "Unexpected live base hash: $base_hash"
            exit 1
          fi

          echo "$v30  site/index.html" | sha256sum -c -
          grep -q 'V30 // LOOT + EVOLVED INFECTED + SKILL TREE' site/index.html
          grep -q 'SURVIVOR SKILL TREE' site/index.html
          grep -q 'EVOLUTION_DEFS' site/index.html
          grep -q 'RARITIES' site/index.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
