name: Deploy Undead Afterdark V28.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild V27 base
        shell: bash
        run: |
          mkdir -p site
          cat \
            tools/v27_mobile/c00.txt \
            tools/v27_mobile/c01.txt \
            tools/v27_mobile/c02.txt \
            tools/v27_mobile/c03.txt \
            tools/v27_mobile/c04.txt \
            tools/v27_mobile/c05.txt \
            tools/v27_mobile/c06.txt \
            tools/v27_mobile/c07a.txt \
            tools/v27_mobile/c07b.txt \
            tools/v27_mobile/c08.txt \
            tools/v27_mobile/c09.txt \
            | tr -d '[:space:]' | base64 --decode > site/game.gz
          echo '524fa105537710706a7d8f888f83e8ec35d875cbe3492ca746bd5afffadf3fc0  site/game.gz' | sha256sum -c -
          gzip -dc site/game.gz > site/index.html
          rm site/game.gz
          echo '8b848f7c81139a029e574414c054f38598507918bc5af5ac32b2c0ff8d8c8806  site/index.html' | sha256sum -c -

      - name: Apply V27.1 mobile input base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    overflow:hidden;\n    touch-action:none;\n  }\n  #wrap{position:relative;width:100vw;height:100vh;background:#080a0c;}\n  canvas{display:block;width:100%;height:100%;background:#12161a;}","    overflow:hidden;\n    touch-action:manipulation;\n  }\n  #wrap{position:relative;width:100vw;height:100vh;background:#080a0c;}\n  canvas{display:block;width:100%;height:100%;background:#12161a;touch-action:none;}",1)
          s=s.replace('#startOverlay{\n  overflow:hidden;','#startOverlay{\n  z-index:50;\n  overflow:hidden;',1)
          s=s.replace(".coopInput{width:100%;box-sizing:border-box;background:#0d1316;border:1px solid rgba(255,255,255,.14);color:#eef4f6;border-radius:8px;padding:12px 13px;font:800 13px system-ui;letter-spacing:.08em;text-transform:uppercase;outline:none}",".coopInput{width:100%;box-sizing:border-box;background:#0d1316;border:1px solid rgba(255,255,255,.14);color:#eef4f6;border-radius:8px;padding:12px 13px;font:800 16px system-ui;letter-spacing:.08em;text-transform:uppercase;outline:none;pointer-events:auto!important;touch-action:manipulation!important;-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default}",1)
          s=s.replace('            <input id="coopName" class="coopInput" maxlength="14" value="SURVIVOR" aria-label="Player name">\n            <input id="coopCode" class="coopInput" maxlength="6" placeholder="ROOM CODE" aria-label="Room code">','            <input id="coopName" class="coopInput" type="text" inputmode="text" maxlength="14" value="SURVIVOR" aria-label="Player name" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">\n            <input id="coopCode" class="coopInput" type="text" inputmode="text" maxlength="6" placeholder="TAP TO TYPE CODE" aria-label="Room code" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">',1)
          s=s.replace("  addEventListener('keydown',e=>{\n    if(e.key.toLowerCase()==='m'){e.preventDefault();toggleWorldMap();return}\n    state.keys[e.key.toLowerCase()]=true;","  addEventListener('keydown',e=>{\n    const tag=(e.target&&e.target.tagName||'').toLowerCase();\n    if(tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable))return;\n    if(e.key.toLowerCase()==='m'){e.preventDefault();toggleWorldMap();return}\n    state.keys[e.key.toLowerCase()]=true;",1)
          anchor="  document.getElementById('continueBtn').onclick=()=>{destroyNetwork();ensureAudio();loadSavedRun()};"
          block=(
            "  // Mobile-safe co-op text entry. Gameplay owns touch gestures only on the canvas; menu inputs remain native controls.\n"
            "  const coopNameInput=document.getElementById('coopName');\n"
            "  const coopCodeInput=document.getElementById('coopCode');\n"
            "  for(const el of [coopNameInput,coopCodeInput]){\n"
            "    if(!el)continue;\n"
            "    for(const ev of ['touchstart','touchend','pointerdown','pointerup','click'])el.addEventListener(ev,e=>e.stopPropagation(),{passive:true});\n"
            "  }\n"
            "  if(coopCodeInput){\n"
            "    coopCodeInput.addEventListener('input',()=>{\n"
            "      const clean=coopCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);\n"
            "      if(coopCodeInput.value!==clean)coopCodeInput.value=clean;\n"
            "    });\n"
            "    coopCodeInput.addEventListener('focus',()=>{state.mouse.down=false;state.fireHeld=false;state.manualAimHold=false});\n"
            "    coopCodeInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();coopCodeInput.blur();joinCoop()}});\n"
            "  }\n"
            "  if(coopNameInput)coopNameInput.addEventListener('focus',()=>{state.mouse.down=false;state.fireHeld=false;state.manualAimHold=false});\n\n"
            + anchor
          )
          s=s.replace(anchor,block,1)
          s=s.replace('V27 // MOBILE + 1–4 PLAYER CO-OP // PUBLIC ALPHA','V27.1 // MOBILE INPUT FIX + 1–4 PLAYER CO-OP',1)
          p.write_text(s,encoding='utf-8')
          PY
          echo 'c80c848e3a0c8ea9d17902c07744b3332c366a44e2df77a25ee7c542bffbc83c  site/index.html' | sha256sum -c -

      - name: Apply V28.3 infected boss and touch update
        shell: bash
        run: |
          cat tools/v28_patch/p00 tools/v28_patch/p01 tools/v28_patch/p02 tools/v28_patch/p03 tools/v28_patch/p04 tools/v28_patch/p05 > /tmp/v283.patch
          cd site
          patch -p1 < /tmp/v283.patch
          echo 'a9733562f13cb2675b29a082a1e52314cfd9469c542c7796df53a12b3b433e74  index.html' | sha256sum -c -
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
