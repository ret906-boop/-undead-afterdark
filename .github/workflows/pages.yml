name: Verify Game Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compressed transfer chunk
        shell: bash
        run: |
          got=$(tr -d '[:space:]' < payload/gz/g00.txt | sha256sum | cut -d' ' -f1)
          echo "g00 $got"
          test "$got" = "c3534cbde760602aa92d3a9d0a651627e4dd389a41a9b006129cbd14afbe7aea"
