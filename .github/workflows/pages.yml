name: Deploy Undead Afterdark V37.14 Inventory Close Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v3714
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore published builds through V37.13
        shell: bash
        run: |
          set -euo pipefail
          versions=(v30.2 v30.3 v31 v32 v33 v34 v35 v36 v37 v37.10 v37.11 v37.12 v37.13)
          for v in "${versions[@]}"; do
            mkdir -p "site/versions/$v"
            curl --fail --location --retry 5 \
              "https://ret906-boop.github.io/-undead-afterdark/versions/$v/?release=${GITHUB_SHA}" \
              -o "site/versions/$v/index.html"
          done
          cp site/versions/v37.13/index.html site/index.html
          grep -q 'V37.13 // WEAPON + PERK INPUT FIX' site/index.html

      - name: Apply V37.14 inventory close fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('site/index.html')
          h = p.read_text()

          marker = '<!-- V37.13 // WEAPON + PERK INPUT FIX -->'
          if h.count(marker) != 1:
              raise RuntimeError('V37.13 marker missing or duplicated')
          h = h.replace(marker, marker + '\n<!-- V37.14 // INVENTORY CLOSE FIX -->', 1)

          patch = r'''
          <script id="v3714-inventory-close-fix">
          (()=>{
            document.title='Undead Afterdark V37.14 Inventory Close Fix';
            const mv=document.querySelector('.menuVersion');if(mv)mv.textContent='V37.14 // INVENTORY CLOSE FIX';
            const overlay=document.getElementById('v31InventoryOverlay');
            const closeBtn=document.getElementById('v31InvClose');
            const inventoryBtn=document.getElementById('v31InventoryBtn');
            if(!overlay||!closeBtn||!inventoryBtn)return;

            closeBtn.style.touchAction='manipulation';
            closeBtn.style.minWidth='88px';
            closeBtn.style.minHeight='48px';
            closeBtn.style.position='relative';
            closeBtn.style.zIndex='20';

            const isOpen=()=>getComputedStyle(overlay).display!=='none';
            const closeInventory=e=>{
              if(e){e.preventDefault();e.stopPropagation()}
              overlay.style.display='none';
              if(typeof state!=='undefined'&&state.joy){state.joy.x=0;state.joy.y=0;state.joy.active=false}
            };

            closeBtn.addEventListener('pointerdown',closeInventory,{passive:false});
            closeBtn.addEventListener('click',closeInventory,{passive:false});

            const oldInventoryClick=inventoryBtn.onclick;
            inventoryBtn.onclick=e=>{
              if(isOpen()){closeInventory(e);return}
              if(typeof oldInventoryClick==='function')oldInventoryClick.call(inventoryBtn,e);
            };

            addEventListener('keydown',e=>{
              if(!isOpen())return;
              if(e.key==='Escape'||e.key==='i'||e.key==='I'){
                e.preventDefault();
                closeInventory(e);
              }
            });
          })();
          </script>
          '''

          if h.count('</body>') != 1:
              raise RuntimeError('Expected one closing body tag')
          h = h.replace('</body>', patch + '\n</body>', 1)
          p.write_text(h)

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', h, re.S)
          for i, script in enumerate(scripts, 1):
              Path(f'/tmp/v3714-script-{i}.js').write_text(script)
          PY

          grep -q 'V37.14 // INVENTORY CLOSE FIX' site/index.html
          grep -q 'v3714-inventory-close-fix' site/index.html
          grep -q "closeBtn.addEventListener('pointerdown'" site/index.html
          grep -q "if(isOpen()){closeInventory(e);return}" site/index.html
          for f in /tmp/v3714-script-*.js; do node --check "$f"; done

      - name: Freeze V37.14 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v37.14
          cp site/index.html site/versions/v37.14/index.html
          touch site/.nojekyll
          sha256sum site/index.html site/versions/v37.14/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
