name: Deploy Undead Afterdark V36

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v36
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified rollback builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v30.2 site/versions/v30.3 site/versions/v31 site/versions/v32 site/versions/v33 site/versions/v34 site/versions/v35
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.2/?release=${GITHUB_SHA}" -o site/versions/v30.2/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.3/?release=${GITHUB_SHA}" -o site/versions/v30.3/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v31/?release=${GITHUB_SHA}" -o site/versions/v31/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v32/?release=${GITHUB_SHA}" -o site/versions/v32/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v33/?release=${GITHUB_SHA}" -o site/versions/v33/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v34/?release=${GITHUB_SHA}" -o site/versions/v34/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v35/?release=${GITHUB_SHA}" -o site/versions/v35/index.html
          echo '420979892d942d2af254b42569fac62adaf5740a0981a89465220b0081888690  site/versions/v30.2/index.html' | sha256sum -c -
          echo '733713cfd49d19f6cf3fc21e469e29b7cf6fd393612934df51dc8a35bbb62906  site/versions/v30.3/index.html' | sha256sum -c -
          echo 'c5a62f81a24c7fba78ab99ef9e36dbe1371dfc78a2936ca3b59794b3a29a2fb6  site/versions/v31/index.html' | sha256sum -c -
          echo 'f97a4f79d4495416bccaa80a0f38605a6f4925091ef9a42fe8e25365580bd46c  site/versions/v32/index.html' | sha256sum -c -
          echo 'd0f07c455a21b27dc74a232a783eca5703f56d9f8becc321a342f61f5fdc7063  site/versions/v33/index.html' | sha256sum -c -
          echo '6c8bb9116f85d50588a41443f60a94dfb25c9e260bdd4103c7ee4602fcab3fbd  site/versions/v34/index.html' | sha256sum -c -
          echo '8bfce44c17f84dca5f4f18df387330f7f99a9a4ed25d04f9f7b8433af5a41367  site/versions/v35/index.html' | sha256sum -c -
          cp site/versions/v35/index.html site/index.html

      - name: Apply verified V36 missions and contracts overhaul
        shell: bash
        run: |
          set -euo pipefail
          echo 'e5f8abbe6a4adb412b12f100ed3fb351c44a451f3e82140b5f76149c5c2dd9f4  tools/v36_patch/c00.txt' | sha256sum -c -
          echo '232ddb09b2a27c23bce55cfcbb195905a37ce4bfd8f09df617440048e57d19cc  tools/v36_patch/c01.txt' | sha256sum -c -
          echo 'ac3071a9462b0a2b55829342dd5ee459929f91f39b2eeaa369475c77bcb39c29  tools/v36_patch/c02.txt' | sha256sum -c -
          echo '0d3644c5ed3ccfe83e25863918834eb805f3a74a8c82e010612c6b8516fbb9a5  tools/v36_patch/c03.txt' | sha256sum -c -
          echo '0fbd02f6bb92bebb887e4dde2570f9f3e13c3b65f8c9250e8dea4b87da3f3032  tools/v36_patch/c04.txt' | sha256sum -c -
          cat tools/v36_patch/c00.txt tools/v36_patch/c01.txt tools/v36_patch/c02.txt tools/v36_patch/c03.txt tools/v36_patch/c04.txt \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/v36.patch.gz
          echo '1a2bbcc664b729fe54c3df0634100b79aed9c8f0d1e5fe7d4a8c0c5f6bf45288  /tmp/v36.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v36.patch.gz > /tmp/v36.patch
          echo 'd2681ff7e26bcb0365b27b90d9f633b1b4f3f7bf83aa5f2076d4ed9bcb0caea5  /tmp/v36.patch' | sha256sum -c -
          cd site
          patch --batch index.html < /tmp/v36.patch
          cd ..
          echo '823e58ddaec95de19e59e11ff8750f515af0e2ade61cfe8a4d8f6182f1bb0acf  site/index.html' | sha256sum -c -
          grep -q 'V36 // MISSIONS + CONTRACTS' site/index.html
          grep -q 'DEAD OR DEADER' site/index.html
          grep -q 'ST. MERCY PHARMACY RAID' site/index.html
          grep -q 'RECOVER POLICE WEAPON SHIPMENT' site/index.html
          grep -q 'TERMINATION CONTRACT' site/index.html

      - name: Freeze V36 rollback build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v36
          cp site/index.html site/versions/v36/index.html
          echo '823e58ddaec95de19e59e11ff8750f515af0e2ade61cfe8a4d8f6182f1bb0acf  site/versions/v36/index.html' | sha256sum -c -
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
