name: Deploy Undead Afterdark V37.1 Shooting Hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v371
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified rollback builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v30.2 site/versions/v30.3 site/versions/v31 site/versions/v32 site/versions/v33 site/versions/v34 site/versions/v35 site/versions/v36 site/versions/v37
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.2/?release=${GITHUB_SHA}" -o site/versions/v30.2/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.3/?release=${GITHUB_SHA}" -o site/versions/v30.3/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v31/?release=${GITHUB_SHA}" -o site/versions/v31/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v32/?release=${GITHUB_SHA}" -o site/versions/v32/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v33/?release=${GITHUB_SHA}" -o site/versions/v33/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v34/?release=${GITHUB_SHA}" -o site/versions/v34/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v35/?release=${GITHUB_SHA}" -o site/versions/v35/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v36/?release=${GITHUB_SHA}" -o site/versions/v36/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v37/?release=${GITHUB_SHA}" -o site/versions/v37/index.html
          echo '420979892d942d2af254b42569fac62adaf5740a0981a89465220b0081888690  site/versions/v30.2/index.html' | sha256sum -c -
          echo '733713cfd49d19f6cf3fc21e469e29b7cf6fd393612934df51dc8a35bbb62906  site/versions/v30.3/index.html' | sha256sum -c -
          echo 'c5a62f81a24c7fba78ab99ef9e36dbe1371dfc78a2936ca3b59794b3a29a2fb6  site/versions/v31/index.html' | sha256sum -c -
          echo 'f97a4f79d4495416bccaa80a0f38605a6f4925091ef9a42fe8e25365580bd46c  site/versions/v32/index.html' | sha256sum -c -
          echo 'd0f07c455a21b27dc74a232a783eca5703f56d9f8becc321a342f61f5fdc7063  site/versions/v33/index.html' | sha256sum -c -
          echo '6c8bb9116f85d50588a41443f60a94dfb25c9e260bdd4103c7ee4602fcab3fbd  site/versions/v34/index.html' | sha256sum -c -
          echo '8bfce44c17f84dca5f4f18df387330f7f99a9a4ed25d04f9f7b8433af5a41367  site/versions/v35/index.html' | sha256sum -c -
          echo '823e58ddaec95de19e59e11ff8750f515af0e2ade61cfe8a4d8f6182f1bb0acf  site/versions/v36/index.html' | sha256sum -c -
          echo 'ea5f9880fea874c92d8d3ce34abbad0cd870ca625b0152d3147f4b242283e8bd  site/versions/v37/index.html' | sha256sum -c -
          cp site/versions/v37/index.html site/index.html

      - name: Apply verified V37.1 mobile menu and base patch
        shell: bash
        run: |
          set -euo pipefail
          echo '92b05fab4d192492b740dd4f636e02c970128868f7db0f149938af0e262f5fcf  tools/v371_patch/p00.txt' | sha256sum -c -
          echo '40da8372f79989a802190036720f608d571b8b96a552ba378931b742e7d0fa1e  tools/v371_patch/p01.txt' | sha256sum -c -
          cat tools/v371_patch/p00.txt tools/v371_patch/p01.txt | tr -d '[:space:]' | base64 --decode > /tmp/v371.patch.gz
          echo '78bca4b783d83cd5543e4e272360cc823d7c0cb6bdd027dfe7c3767121784247  /tmp/v371.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v371.patch.gz > /tmp/v371.patch
          echo 'e29f6c8d82011501df5cefc6c601025f83181d0bcfa590f0e38387025ce2e646  /tmp/v371.patch' | sha256sum -c -
          cd site
          patch --batch index.html < /tmp/v371.patch
          cd ..
          echo '9bb9602373678624b9e69251bd53923fd93f9ee48f1be15cdc546c291418b77f  site/index.html' | sha256sum -c -
          grep -q 'V37.1 // MOBILE MENU + BASE FIX' site/index.html
          grep -q 'PAUSED • MENU OPEN' site/index.html
          grep -q 'v371DrawSafehouseCompound' site/index.html
          grep -q '100dvh' site/index.html

      - name: Apply runtime and mobile shooting hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()

          replacements = [
              ("s===V35_SAFEHOUSES.guard?", "s?.short==='GUARD'?"),
              ("s===V35_SAFEHOUSES.ranger?", "s?.short==='RANGER'?"),
              ("const AIM_DEADZONE=9, FIRE_ON_RADIUS=52, FIRE_OFF_RADIUS=40;", "const AIM_DEADZONE=9;"),
              ("if(state.fireHeld){if(l<FIRE_OFF_RADIUS)state.fireHeld=false}else if(l>FIRE_ON_RADIUS){state.fireHeld=true}", "if(fireTouchId!==null)state.fireHeld=true"),
              ("fireOriginX=t.clientX;fireOriginY=t.clientY;state.fireHeld=false;state.fireAim.active=false;state.manualAimHold=true", "fireOriginX=t.clientX;fireOriginY=t.clientY;state.fireHeld=true;state.fireAim.active=false;state.manualAimHold=true"),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 match for {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q "s?.short==='GUARD'" site/index.html
          grep -q "s?.short==='RANGER'" site/index.html
          grep -q 'if(fireTouchId!==null)state.fireHeld=true' site/index.html
          grep -q 'fireOriginY=t.clientY;state.fireHeld=true;state.fireAim.active=false' site/index.html
          if grep -q 'FIRE_ON_RADIUS' site/index.html; then echo 'Old firing threshold still present' >&2; exit 1; fi

      - name: Freeze shooting-hotfix build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v37.1-shootfix
          cp site/index.html site/versions/v37.1-shootfix/index.html
          sha256sum site/index.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
