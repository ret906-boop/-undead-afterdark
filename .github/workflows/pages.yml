name: Deploy Undead Afterdark V29

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v29
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build verified V29 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          curl --fail --location --retry 5 \
            "https://ret906-boop.github.io/-undead-afterdark/?v29base=${GITHUB_SHA}" \
            -o /tmp/base.html

          base_hash=$(sha256sum /tmp/base.html | awk '{print $1}')
          v286='322635ff84ce001ed9c3d3f5dfe02222f8e89b3ac9613e3b2d81753821151859'
          v29='ecdabdc562b8701172880ab44dea080e9ae3cf8e03ba185af2421cbb94589756'

          if [ "$base_hash" = "$v29" ]; then
            cp /tmp/base.html site/index.html
          elif [ "$base_hash" = "$v286" ]; then
            tr -d '[:space:]' < tools/v29_patch/v29.patch.gz.b64 | base64 --decode | gzip -dc > /tmp/v29.patch
            echo '0a0a479668929b53e8b578b3e9d457611cdc8857a753103d04704df45de091b2  /tmp/v29.patch' | sha256sum -c -
            cp /tmp/base.html site/index.html
            cd site
            patch -p1 < /tmp/v29.patch
            cd ..
          else
            echo "Unexpected live base hash: $base_hash"
            exit 1
          fi

          echo "$v29  site/index.html" | sha256sum -c -
          grep -q 'V29 // SURVIVOR PROGRESSION + BOSS PHASES' site/index.html
          grep -q "undead_afterdark_profile_v1" site/index.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
