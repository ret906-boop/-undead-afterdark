name: Deploy Undead Afterdark V9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify V8 base
        shell: bash
        run: |
          mkdir -p site
          cat payload/v8/h*.txt | tr -d '[:space:]' | base64 --decode > site/game.gz
          gzip -dc site/game.gz > site/index.html
          rm site/game.gz
          echo '5b9567528d15c940a8fe47ac441c8c2da07a2fd5b7fad309180f9fa03d4d3014  site/index.html' | sha256sum -c -

      - name: Apply and verify V9 animation build
        shell: bash
        run: |
          python3 tools/patch_v9.py site/index.html
          echo '09bec15f4ba03034892d2ad89c8de04a12b65a4a1a21d4a498c1468d4e0a1e0c  site/index.html' | sha256sum -c -
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
