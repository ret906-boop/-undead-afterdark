name: Deploy Undead Afterdark V37

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v37
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified rollback builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v30.2 site/versions/v30.3 site/versions/v31 site/versions/v32 site/versions/v33 site/versions/v34 site/versions/v35 site/versions/v36
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.2/?release=${GITHUB_SHA}" -o site/versions/v30.2/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.3/?release=${GITHUB_SHA}" -o site/versions/v30.3/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v31/?release=${GITHUB_SHA}" -o site/versions/v31/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v32/?release=${GITHUB_SHA}" -o site/versions/v32/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v33/?release=${GITHUB_SHA}" -o site/versions/v33/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v34/?release=${GITHUB_SHA}" -o site/versions/v34/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v35/?release=${GITHUB_SHA}" -o site/versions/v35/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v36/?release=${GITHUB_SHA}" -o site/versions/v36/index.html
          echo '420979892d942d2af254b42569fac62adaf5740a0981a89465220b0081888690  site/versions/v30.2/index.html' | sha256sum -c -
          echo '733713cfd49d19f6cf3fc21e469e29b7cf6fd393612934df51dc8a35bbb62906  site/versions/v30.3/index.html' | sha256sum -c -
          echo 'c5a62f81a24c7fba78ab99ef9e36dbe1371dfc78a2936ca3b59794b3a29a2fb6  site/versions/v31/index.html' | sha256sum -c -
          echo 'f97a4f79d4495416bccaa80a0f38605a6f4925091ef9a42fe8e25365580bd46c  site/versions/v32/index.html' | sha256sum -c -
          echo 'd0f07c455a21b27dc74a232a783eca5703f56d9f8becc321a342f61f5fdc7063  site/versions/v33/index.html' | sha256sum -c -
          echo '6c8bb9116f85d50588a41443f60a94dfb25c9e260bdd4103c7ee4602fcab3fbd  site/versions/v34/index.html' | sha256sum -c -
          echo '8bfce44c17f84dca5f4f18df387330f7f99a9a4ed25d04f9f7b8433af5a41367  site/versions/v35/index.html' | sha256sum -c -
          echo '823e58ddaec95de19e59e11ff8750f515af0e2ade61cfe8a4d8f6182f1bb0acf  site/versions/v36/index.html' | sha256sum -c -
          cp site/versions/v36/index.html site/index.html

      - name: Apply verified V37 mobile command UI
        shell: bash
        run: |
          set -euo pipefail
          echo '38b84dfad48196a7568fa8966a2bb0f0537a9aa6b1ac49bc423001e89b3aea7a  tools/v37_patch/p00.txt' | sha256sum -c -
          echo 'fdc470e44ab0366177a12a1d0fc112b5695f07e5ba310352731e6579b025a53e  tools/v37_patch/p01.txt' | sha256sum -c -
          echo '186e3e182ff61a1b772a997a5acd43a6ed30b843d364055d60ceb21903e39383  tools/v37_patch/p02.txt' | sha256sum -c -
          echo 'f6c4a9910c754ef2cef6908aa002935f60cb4bd1efff3d17644eb758da95197a  tools/v37_patch/p03.txt' | sha256sum -c -
          echo 'a7ba2c8e7e8021b9df9ff102fe754c03fcad8bcb13cb6cf37355f5a02e03965e  tools/v37_patch/p04.txt' | sha256sum -c -
          echo '04cf05944a7dd237857f90308548429b08e3260c0a56d7d87d66b5713559d699  tools/v37_patch/p05.txt' | sha256sum -c -
          echo 'b1465ce06b5509b7f2eb82338acaf20d4ceb043ddd8ac2ce614cb5615c7597c4  tools/v37_patch/p06.txt' | sha256sum -c -
          echo 'b3e0b3efceb0021940b7035fbf6f5daf9ba52bb408f15c8c6212cec627c686a4  tools/v37_patch/p07.txt' | sha256sum -c -
          echo '9a2e469836d00dcdf36ef35d7ad02ca5dc7b09ce9228c61d6f1e9c715abf7cb1  tools/v37_patch/p08.txt' | sha256sum -c -
          echo '724451db04a3694a7ff657f54b4b836ff3a85546c52582c61d1ec7f25015d4ef  tools/v37_patch/p09.txt' | sha256sum -c -
          cat tools/v37_patch/p00.txt tools/v37_patch/p01.txt tools/v37_patch/p02.txt tools/v37_patch/p03.txt tools/v37_patch/p04.txt tools/v37_patch/p05.txt tools/v37_patch/p06.txt tools/v37_patch/p07.txt tools/v37_patch/p08.txt tools/v37_patch/p09.txt \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/v37.patch.gz
          echo 'c1b3d812e854c05709e4ab8f9ee8a246cae9f4beb52b20e95365874b5a67e88d  /tmp/v37.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v37.patch.gz > /tmp/v37.patch
          echo '7f920fc6f13131f70985105f8028e142ae810bcd1a420c6c43d57052e84cf39a  /tmp/v37.patch' | sha256sum -c -
          cd site
          patch --batch index.html < /tmp/v37.patch
          cd ..
          echo 'ea5f9880fea874c92d8d3ce34abbad0cd870ca625b0152d3147f4b242283e8bd  site/index.html' | sha256sum -c -
          grep -q 'V37 // MOBILE COMMAND UI' site/index.html
          grep -q 'FIELD COMMAND' site/index.html
          grep -q 'v37MobileDock' site/index.html
          grep -q 'v37ThreatNote' site/index.html

      - name: Freeze V37 rollback build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v37
          cp site/index.html site/versions/v37/index.html
          echo 'ea5f9880fea874c92d8d3ce34abbad0cd870ca625b0152d3147f4b242283e8bd  site/versions/v37/index.html' | sha256sum -c -
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
