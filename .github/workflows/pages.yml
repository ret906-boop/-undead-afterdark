name: Deploy Undead Afterdark V27.1 Mobile Co-op

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify V27 mobile co-op site
        shell: bash
        run: |
          mkdir -p site
          cat \
            tools/v27_mobile/c00.txt \
            tools/v27_mobile/c01.txt \
            tools/v27_mobile/c02.txt \
            tools/v27_mobile/c03.txt \
            tools/v27_mobile/c04.txt \
            tools/v27_mobile/c05.txt \
            tools/v27_mobile/c06.txt \
            tools/v27_mobile/c07a.txt \
            tools/v27_mobile/c07b.txt \
            tools/v27_mobile/c08.txt \
            tools/v27_mobile/c09.txt \
            | tr -d '[:space:]' | base64 --decode > site/game.gz
          echo '524fa105537710706a7d8f888f83e8ec35d875cbe3492ca746bd5afffadf3fc0  site/game.gz' | sha256sum -c -
          gzip -dc site/game.gz > site/index.html
          rm site/game.gz
          echo '8b848f7c81139a029e574414c054f38598507918bc5af5ac32b2c0ff8d8c8806  site/index.html' | sha256sum -c -

      - name: Apply and verify V27.1 mobile co-op input fix
        shell: bash
        run: |
          echo '87f29ace3e4f5bcd2a7722867c9c02564abcdce36cf8ea26b1f399793f186de6  tools/v27_mobile_input.patch.gz.b64' | sha256sum -c -
          tr -d '[:space:]' < tools/v27_mobile_input.patch.gz.b64 | base64 --decode | gzip -dc > /tmp/v27_mobile_input.patch
          patch --batch --forward site/index.html < /tmp/v27_mobile_input.patch
          echo 'c80c848e3a0c8ea9d17902c07744b3332c366a44e2df77a25ee7c542bffbc83c  site/index.html' | sha256sum -c -
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
