name: Deploy Undead Afterdark V33

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v33
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified rollback builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v30.2 site/versions/v30.3 site/versions/v31 site/versions/v32
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.2/?release=${GITHUB_SHA}" -o site/versions/v30.2/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.3/?release=${GITHUB_SHA}" -o site/versions/v30.3/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v31/?release=${GITHUB_SHA}" -o site/versions/v31/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v32/?release=${GITHUB_SHA}" -o site/versions/v32/index.html
          echo '420979892d942d2af254b42569fac62adaf5740a0981a89465220b0081888690  site/versions/v30.2/index.html' | sha256sum -c -
          echo '733713cfd49d19f6cf3fc21e469e29b7cf6fd393612934df51dc8a35bbb62906  site/versions/v30.3/index.html' | sha256sum -c -
          echo 'c5a62f81a24c7fba78ab99ef9e36dbe1371dfc78a2936ca3b59794b3a29a2fb6  site/versions/v31/index.html' | sha256sum -c -
          echo 'f97a4f79d4495416bccaa80a0f38605a6f4925091ef9a42fe8e25365580bd46c  site/versions/v32/index.html' | sha256sum -c -
          cp site/versions/v32/index.html site/index.html

      - name: Apply verified V33 survivor classes
        shell: bash
        run: |
          set -euo pipefail
          echo '4100dd3df0f5e5d9da9e768c0b5a562e5b055060cd26814e21b483785dc5b12d  tools/v33_patch/c00.txt' | sha256sum -c -
          echo 'f1735ce0e2e8500508ce325fb9a88c70e8651304f9156008590b764a8230b502  tools/v33_patch/c01.txt' | sha256sum -c -
          echo 'bb4980b04876bc432c534a115c6f760d56c0826cff1da2f84bdb3cb6296f7739  tools/v33_patch/c02.txt' | sha256sum -c -
          echo 'f7f08732892483fae0114cadc49e450fd86040979c060896fc30ff68b6e46ea6  tools/v33_patch/c03.txt' | sha256sum -c -
          cat tools/v33_patch/c00.txt tools/v33_patch/c01.txt tools/v33_patch/c02.txt tools/v33_patch/c03.txt \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/v33.patch.gz
          echo 'ca4023ac46861b9c911bdae20968a46fbd7015bd2d4f056c9dac5028a7739a39  /tmp/v33.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v33.patch.gz > /tmp/v33.patch
          echo 'a51e624d92232ac5fc8b1b9fbc749d013f39d10ed92368e6078f00dc8eb123c3  /tmp/v33.patch' | sha256sum -c -
          cd site
          patch -p1 < /tmp/v33.patch
          cd ..
          echo 'd0f07c455a21b27dc74a232a783eca5703f56d9f8becc321a342f61f5fdc7063  site/index.html' | sha256sum -c -
          grep -q 'V33 // SURVIVOR CLASSES' site/index.html
          grep -q 'OVERDRIVE' site/index.html
          grep -q 'FIELD HEAL' site/index.html
          grep -q 'FORTIFY PULSE' site/index.html
          grep -q 'ADRENALINE RUSH' site/index.html

      - name: Freeze V33 rollback build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v33
          cp site/index.html site/versions/v33/index.html
          echo 'd0f07c455a21b27dc74a232a783eca5703f56d9f8becc321a342f61f5fdc7063  site/versions/v33/index.html' | sha256sum -c -
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
