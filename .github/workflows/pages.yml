name: Deploy Undead Afterdark V35

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v35
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified rollback builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v30.2 site/versions/v30.3 site/versions/v31 site/versions/v32 site/versions/v33 site/versions/v34
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.2/?release=${GITHUB_SHA}" -o site/versions/v30.2/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v30.3/?release=${GITHUB_SHA}" -o site/versions/v30.3/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v31/?release=${GITHUB_SHA}" -o site/versions/v31/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v32/?release=${GITHUB_SHA}" -o site/versions/v32/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v33/?release=${GITHUB_SHA}" -o site/versions/v33/index.html
          curl --fail --location --retry 5 "https://ret906-boop.github.io/-undead-afterdark/versions/v34/?release=${GITHUB_SHA}" -o site/versions/v34/index.html
          echo '420979892d942d2af254b42569fac62adaf5740a0981a89465220b0081888690  site/versions/v30.2/index.html' | sha256sum -c -
          echo '733713cfd49d19f6cf3fc21e469e29b7cf6fd393612934df51dc8a35bbb62906  site/versions/v30.3/index.html' | sha256sum -c -
          echo 'c5a62f81a24c7fba78ab99ef9e36dbe1371dfc78a2936ca3b59794b3a29a2fb6  site/versions/v31/index.html' | sha256sum -c -
          echo 'f97a4f79d4495416bccaa80a0f38605a6f4925091ef9a42fe8e25365580bd46c  site/versions/v32/index.html' | sha256sum -c -
          echo 'd0f07c455a21b27dc74a232a783eca5703f56d9f8becc321a342f61f5fdc7063  site/versions/v33/index.html' | sha256sum -c -
          echo '6c8bb9116f85d50588a41443f60a94dfb25c9e260bdd4103c7ee4602fcab3fbd  site/versions/v34/index.html' | sha256sum -c -
          cp site/versions/v34/index.html site/index.html

      - name: Apply verified V35 safehouse and base building overhaul
        shell: bash
        run: |
          set -euo pipefail
          echo '027301d7988e312d9e9c331b65356b3ee8de71a96871dc97f3fb272874c7a155  tools/v35_patch/c00.txt' | sha256sum -c -
          echo 'adc29d4cfaade331b237332089f159713f0c49fcc6a79234765d9ae7be0bcf7b  tools/v35_patch/c01.txt' | sha256sum -c -
          echo '81964e0b507ca6fbf20903bdfbe32cb9fa9dede12b710a88679d5017821c19d5  tools/v35_patch/c02.txt' | sha256sum -c -
          echo 'b625a766c5a29d8d4f9305e9826e5683d72f995436ce37010140fb300308ba63  tools/v35_patch/c03.txt' | sha256sum -c -
          echo 'daa3e15c7fc56b6d223edde90f1da5187c2fc269252a8055d2b6effa24dfedcf  tools/v35_patch/c04.txt' | sha256sum -c -
          cat tools/v35_patch/c00.txt tools/v35_patch/c01.txt tools/v35_patch/c02.txt tools/v35_patch/c03.txt tools/v35_patch/c04.txt \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/v35.patch.gz
          echo 'bbac4d71d173c9aef77c1794b47a8438d33d2bdcbe18450a47b76427db354446  /tmp/v35.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v35.patch.gz > /tmp/v35.patch
          echo 'c8fa28a7a177bdc300d65f83095eff5d837e3f107bcf0ae90960290caddb2d62  /tmp/v35.patch' | sha256sum -c -
          cd site
          patch index.html < /tmp/v35.patch
          cd ..
          echo '8bfce44c17f84dca5f4f18df387330f7f99a9a4ed25d04f9f7b8433af5a41367  site/index.html' | sha256sum -c -
          grep -q 'V35 // SAFEHOUSE + BASE BUILDING' site/index.html
          grep -q 'SAFEHOUSE + BASE' site/index.html
          grep -q 'BASE PARTS' site/index.html
          grep -q 'SAFEHOUSE RAID' site/index.html
          grep -q 'PERIMETER DEFENSE' site/index.html

      - name: Freeze V35 rollback build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/versions/v35
          cp site/index.html site/versions/v35/index.html
          echo '8bfce44c17f84dca5f4f18df387330f7f99a9a4ed25d04f9f7b8433af5a41367  site/versions/v35/index.html' | sha256sum -c -
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
