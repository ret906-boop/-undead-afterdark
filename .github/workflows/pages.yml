name: Deploy Undead Afterdark V10

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify V10 game
        shell: bash
        run: |
          mkdir -p site
          cat payload/v10/k*.txt | tr -d '[:space:]' | base64 --decode > site/game.gz
          gzip -dc site/game.gz > site/index.html
          rm site/game.gz
          echo '209e48445d4abe5888aa903c18130662c0b0e421e50fd70be35c0c4b3a6e458d  site/index.html' | sha256sum -c -
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
