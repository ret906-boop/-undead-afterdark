name: Deploy Undead Afterdark V25

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V14 payload
        shell: bash
        run: |
          check() { got=$(tr -d '[:space:]' < "$1" | sha256sum | cut -d' ' -f1); echo "$1 $got"; test "$got" = "$2"; }
          check payload/v14/n00.txt e23a25f23ec9b57c0ddc2d4a0c586270979759d2c07d06fe011a6c7c69859126
          check payload/v14/n01.txt f9f034bbd2317b549efce188541b3946708f524257195bfebba1ee95578b2af3
          check payload/v14/n02.txt d95b580c45044aaca35d4a65339ba92eb7c24bbae8a1cd2b41ccdbe71af6c601
          check payload/v14/n03.txt fbcbe584bc45044aaca35d4a65339ba92eb7c24bbae8a1cd2b41ccdbe71af6c601
